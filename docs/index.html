<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Physics — Class of 2026</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        background: radial-gradient(circle at center, #18233a, #050812 70%);
        color: white;
        text-align: center;
        overflow: hidden;
    }

    .container {
        width: 90%;
        max-width: 500px;
        padding: 40px 25px;
    }

    .atom {
        font-size: 75px;
        margin-bottom: 15px;
        animation: float 3s ease-in-out infinite;
    }

    h1 {
        font-size: 28px;
        letter-spacing: 4px;
        margin: 10px 0;
    }

    h2 {
        font-size: 16px;
        font-weight: normal;
        letter-spacing: 3px;
        opacity: 0.75;
        margin-bottom: 35px;
    }

    .message {
        font-size: 17px;
        line-height: 1.8;
        opacity: 0.9;
        margin-bottom: 30px;
    }

    button {
        border: none;
        border-radius: 50px;
        padding: 15px 35px;
        font-size: 16px;
        cursor: pointer;
        background: white;
        color: #101522;
        transition: 0.3s;
    }

    button:hover {
        transform: scale(1.05);
    }

    .footer {
        margin-top: 35px;
        font-size: 13px;
        opacity: 0.5;
        letter-spacing: 1px;
    }

    @keyframes float {
        0%, 100% {
            transform: translateY(0);
        }
        50% {
            transform: translateY(-10px);
        }
    }
</style>
</head>

<body>

<div class="container">

    <div class="atom">⚛</div>

    <h1>PHYSICS</h1>

    <h2>CLASS OF 2026</h2>

    <div class="message">
        One last message<br>
        before we leave the classroom...
    </div>

    <audio id="audio" src="message.mp3"></audio>

    <button onclick="playAudio()">
        ▶ PLAY MESSAGE
    </button>

    <div class="footer">
        RAZI UNIVERSITY
    </div>

</div>

<script>
function playAudio() {
    const audio = document.getElementById("audio");

    if (audio.paused) {
        audio.play();
    } else {
        audio.pause();
    }
}
</script>

</body>
</html>
